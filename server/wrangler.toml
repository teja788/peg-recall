# Color Catch room server on Cloudflare (server/README.md, "Cloudflare").
# Workers Free plan: one SQLite-backed Durable Object holds every room
# (src/cloudflare.ts explains why one).
name = "color-catch-rooms"
main = "src/cloudflare.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomsObject"

# the Free plan only allows SQLite-backed Durable Objects
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomsObject"]

[vars]
# the web game's address(es), comma-separated, e.g. "https://colorcatch.pages.dev"
PUBLIC_ORIGINS = ""
# "on" holds free hosts to the free limits (decision D4); keep it equal to the
# web/app build's EXPO_PUBLIC_HOST_LIMITS
HOST_LIMITS = "off"
# STATS_TOKEN is a secret: npx wrangler secret put STATS_TOKEN
